name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-packages:
    name: Verify and pack packages
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify source packages
        run: |
          pnpm --dir packages/core quality
          pnpm --dir packages/react-native quality
      - name: Pack the verified source
        run: |
          mkdir -p "$RUNNER_TEMP/npm-packages"
          pnpm --dir packages/core --config.ignore-scripts=true pack --out "$RUNNER_TEMP/npm-packages/core.tgz"
          pnpm --dir packages/react-native --config.ignore-scripts=true pack --out "$RUNNER_TEMP/npm-packages/react-native.tgz"
          cd "$RUNNER_TEMP/npm-packages"
          sha256sum core.tgz react-native.tgz > SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages
          path: ${{ runner.temp }}/npm-packages/
          if-no-files-found: error
          retention-days: 7

  publish-packages:
    name: Publish verified packages
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop-app, verify-packages]
    environment: release-signing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # This runner executes no checkout, dependency install, build or package
      # lifecycle scripts. Only the tested tarballs cross from verification.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Match .nvmrc without checking out executable repository content.
          node-version: '24.21.0'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-packages
          path: npm-packages
      - name: Verify tarballs and trusted-publishing client
        working-directory: npm-packages
        run: |
          sha256sum --check SHA256SUMS.txt
          node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) throw new Error("npm >=11.5.1 is required for trusted publishing")' "$(npm --version)"
      - name: Publish @rndevtools/core
        working-directory: npm-packages
        run: npm publish ./core.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org
      - name: Publish @rndevtools/react-native
        working-directory: npm-packages
        run: npm publish ./react-native.tgz --access public --ignore-scripts --registry=https://registry.npmjs.org

  desktop-app:
    name: Desktop app
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release-signing
    # This label is an Apple silicon standard runner; the release script also checks arm64.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/native/rndevtools-sim-helper/go.mod
          cache-dependency-path: apps/desktop/native/rndevtools-sim-helper/go.mod
      - name: Install
        env:
          HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      - name: Public content and desktop checks
        run: |
          pnpm check:public
          pnpm --filter @rndevtools/desktop release:check
          pnpm --filter @rndevtools/desktop quality
      - name: Build, sign, notarize and verify arm64 DMG
        env:
          # The same team signs Electron and every native helper. The helper
          # compiles this team into its parent-attestation requirement.
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PROFILE: rndevtools-release
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node -e 'for (const key of ["APPLE_TEAM_ID", "CSC_LINK", "CSC_KEY_PASSWORD"]) { if (!process.env[key]) throw new Error(`Missing release secret: ${key}`); }'
          node scripts/store-notary-credentials.mjs
          node apps/desktop/scripts/release-macos.mjs --preflight
          pnpm --filter @rndevtools/desktop release:mac
      - name: Verify native capabilities
        run: pnpm --filter @rndevtools/desktop native:verify:capabilities
      - name: Verify packaged cold start
        run: pnpm --filter @rndevtools/desktop native:verify:cold-start 'release/public/mac-arm64/RN Devtools.app'
      - name: Retain verified artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rndevtools-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/release/public/*.dmg
            apps/desktop/release/public/SHA256SUMS.txt
            apps/desktop/release/public/release-manifest.json
      - name: Prepare draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apps/desktop/release/public/*.dmg
            apps/desktop/release/public/SHA256SUMS.txt
            apps/desktop/release/public/release-manifest.json
