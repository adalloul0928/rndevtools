name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-packages:
    name: Publish packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop-app
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Required for npm provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      # Publishing ships source, so the gates are the only thing standing
      # between a tag and a broken release.
      - name: Verify
        run: |
          pnpm --dir packages/core quality
          pnpm --dir packages/react-native quality
      - name: Publish @rndevtools/core
        run: pnpm --dir packages/core publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Publish @rndevtools/react-native
        run: pnpm --dir packages/react-native publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

  desktop-app:
    name: Desktop app
    # This label is an Apple silicon standard runner; the release script also checks arm64.
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
      # Compiled into the simulator helper's parent attestation. Without it the
      # helper fails closed and refuses every mutation.
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PROFILE: rndevtools-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/native/rndevtools-sim-helper/go.mod
          cache-dependency-path: apps/desktop/native/rndevtools-sim-helper/go.mod
      - name: Require public distribution credentials
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          const required = ['HEROUI_AUTH_TOKEN', 'APPLE_TEAM_ID', 'CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD'];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`Missing release secrets: ${missing.join(', ')}`);
          execFileSync('/usr/bin/xcrun', [
            'notarytool', 'store-credentials', process.env.APPLE_KEYCHAIN_PROFILE,
            '--apple-id', process.env.APPLE_ID,
            '--team-id', process.env.APPLE_TEAM_ID,
            '--password', process.env.APPLE_APP_SPECIFIC_PASSWORD,
          ], { stdio: 'pipe' });
          JS
          node apps/desktop/scripts/release-macos.mjs --preflight
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Public content and desktop checks
        run: |
          pnpm check:public
          pnpm --filter @rndevtools/desktop release:check
          pnpm --filter @rndevtools/desktop quality
      - name: Build, sign, notarize and verify arm64 DMG
        run: pnpm --filter @rndevtools/desktop release:mac
      - name: Verify native capabilities
        run: pnpm --filter @rndevtools/desktop native:verify:capabilities
      - name: Verify packaged cold start
        run: pnpm --filter @rndevtools/desktop native:verify:cold-start 'release/public/mac-arm64/RN Devtools.app'
      - name: Retain verified artifacts for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rndevtools-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/release/public/*.dmg
            apps/desktop/release/public/SHA256SUMS.txt
            apps/desktop/release/public/release-manifest.json
      - name: Prepare draft GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            apps/desktop/release/public/*.dmg
            apps/desktop/release/public/SHA256SUMS.txt
            apps/desktop/release/public/release-manifest.json
