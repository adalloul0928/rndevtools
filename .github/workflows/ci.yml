name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    name: Packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Public content
        run: |
          node --test scripts/check-public-content.test.mjs
          node scripts/check-public-content.mjs
      # Neither npm package needs an install script, so none run here. That
      # keeps dependency postinstall code off a job that builds fork PRs.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Core
        run: pnpm --dir packages/core quality
      - name: React Native host runtime
        run: pnpm --dir packages/react-native quality
      - name: Example app
        run: pnpm --dir examples/expo-demo quality
      # Exports the demo's iOS and Android release bundles the way a store
      # build does (production, minified, Hermes bytecode) with no app
      # variable set, because a release build must be pruned without being
      # told to, then fails if any devtools marker survives in the bytecode.
      - name: Example release bundle
        run: pnpm --dir examples/expo-demo verify:bundle

  native:
    name: Native helpers
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # setup-node can infer a package-manager cache from package.json's
          # packageManager and call pnpm, which this job deliberately does
          # not install.
          package-manager-cache: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: apps/desktop/native/rndevtools-sim-helper/go.mod
          cache-dependency-path: apps/desktop/native/rndevtools-sim-helper/go.mod
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      # These scripts use only Node builtins, so the project's real Go gate
      # (gofmt, vet, race tests, govulncheck, module allowlist), the check that
      # the Swift host's generated HelperVersion.swift matches package.json, and
      # the SimSlim provenance check run with no install and no secrets. Fork
      # contributors get the same coverage as maintainers.
      - name: Go helper checks
        working-directory: apps/desktop
        run: node scripts/check-native-helpers.mjs --go
      # Compile coverage only. `swift test` passes in about a second on real
      # hardware but hangs indefinitely on GitHub's hosted macOS runners: the
      # suite probes real media hardware (AVCaptureDevice, a VideoToolbox
      # compression session) and exercises process-group reaping, and those
      # runners are headless VMs. Run it locally with `pnpm native:check:swift`,
      # or use the manual "Swift tests" workflow to identify the blocking test.
      - name: Swift native host builds
        working-directory: apps/desktop/native/rndevtools-native-host
        timeout-minutes: 10
        run: swift build
      - name: Vendored SimSlim provenance
        working-directory: apps/desktop
        run: node --test scripts/verify-vendored-simslim.node-test.mjs

  desktop:
    name: Desktop
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Nothing in this job needs the HeroUI Pro license: the main process,
      # preload and shared code never import it, and Biome, knip and the
      # script tests read sources without resolving it. Install scripts stay
      # off, as in the Packages job, so a fork pull request runs no dependency
      # code either, and pnpm's side-effects cache stays off so a restored
      # store never hands this job hydrated licensed files. The renderer,
      # which does import the licensed package, is checked by the Desktop
      # renderer job below.
      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --config.side-effects-cache=false
      - name: Lint
        run: pnpm --filter @rndevtools/desktop lint
      - name: Typecheck main, preload and shared
        run: pnpm --filter @rndevtools/desktop typecheck:node
      # Unused devDependencies are left to the Desktop renderer job. `motion`
      # and `tailwind-variants` are peers of HeroUI Pro that only its hydrated
      # manifest declares, so without the license knip reports them as unused,
      # and with it an ignoreDependencies entry becomes a configuration hint,
      # which this repository treats as an error.
      - name: Unused exports and import cycles
        run: |
          pnpm --filter @rndevtools/desktop check:unused --exclude devDependencies
          pnpm --filter @rndevtools/desktop check:cycles
      - name: Test main, preload and shared
        run: pnpm --filter @rndevtools/desktop test:run:node
      # Plain `node --test` suites for the bundled-notice generator, the macOS
      # release preflight, the native host version drift check and the SimSlim
      # provenance check. The Native helpers job runs the last two against the
      # real checkout and toolchain; this is their unit coverage.
      - name: Script tests
        run: |
          pnpm --filter @rndevtools/desktop licenses:check
          pnpm --filter @rndevtools/desktop release:check
          pnpm --filter @rndevtools/desktop native:check:packaging

  desktop-renderer:
    name: Desktop renderer
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HEROUI_AUTH_TOKEN: ${{ secrets.HEROUI_AUTH_TOKEN }}
    steps:
      # The renderer imports HeroUI Pro, a licensed library. Without a token
      # the install still succeeds but the package is not hydrated, so the
      # renderer typecheck and the build fail on a missing module. Secrets are
      # unavailable to job-level `if`, so the token is detected here. A pull
      # request from a fork can never read it and skips the gate with a
      # notice. The repository's own pushes and pull requests fail instead:
      # there a missing token means the secret was never configured, and
      # skipping would let every renderer change through while this job
      # reports success.
      - name: Detect HeroUI Pro license
        id: license
        env:
          CAN_READ_SECRETS: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.fork == false }}
        run: |
          if [ -n "${HEROUI_AUTH_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          elif [ "${CAN_READ_SECRETS}" = "true" ]; then
            echo "::error title=HEROUI_AUTH_TOKEN is missing::This run can read repository secrets, but HEROUI_AUTH_TOKEN is not set, so the Electron renderer cannot be typechecked or built. Add the HeroUI Pro license token as an Actions secret named HEROUI_AUTH_TOKEN."
            exit 1
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Desktop renderer gate skipped::HEROUI_AUTH_TOKEN is not available to a pull request from a fork, so the Electron renderer was not typechecked or built. A maintainer must run this job for changes under apps/desktop/src/renderer."
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.license.outputs.available == 'true'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.license.outputs.available == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.license.outputs.available == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # The HeroUI Pro install script hydrates the licensed package. pnpm's
      # side-effects cache would copy that result into the store, which
      # setup-node saves to the Actions cache, and a pull request from a fork
      # can restore the default branch's caches. Keeping the cache off leaves
      # only the public stub in the store.
      - name: Install
        if: steps.license.outputs.available == 'true'
        run: pnpm install --frozen-lockfile --config.side-effects-cache=false
      # The whole gate, not only the renderer typecheck, renderer tests and
      # build that need the license: `quality` is the one command AGENTS.md
      # and the release workflow name, so running it keeps CI equal to it.
      - name: Desktop quality
        if: steps.license.outputs.available == 'true'
        run: pnpm --filter @rndevtools/desktop quality
