packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'

nodeLinker: hoisted
engineStrict: true
minimumReleaseAge: 10080
# Exact exceptions for the official Expo 57.0.22 patch cohort (2026-09-11).
# These age into the global seven-day policy on 2026-09-18.
minimumReleaseAgeExclude:
  - "@expo/cli@57.0.24"
  - "@expo/fingerprint@0.20.13"
  - "@expo/metro-file-map@57.0.3"
  - "@expo/prebuild-config@57.0.16"
  - "@expo/ui@57.0.18"
  - babel-preset-expo@57.0.11
  - expo-asset@57.0.17
  - expo-constants@57.0.18
  - expo-file-system@57.0.7
  - expo-font@57.0.4
  - expo-image-picker@57.0.17
  - expo-keep-awake@57.0.2
  - expo-modules-autolinking@57.0.13
  - expo-modules-core@57.0.18
  - expo-modules-jsi@57.1.0
  - expo-device@57.0.2
  - expo-splash-screen@57.0.9
  - expo-json-utils@57.0.2
  - expo-manifests@57.0.2
  - expo-updates-interface@57.0.2
  - expo@57.0.22

blockExoticSubdeps: true

overrides:
  '@types/react': 19.2.18
  'react-dom': 19.2.3
  '@react-native/jest-preset': 0.86.3

allowBuilds:
  "@zowe/secrets-for-zowe-sdk": false
  "@heroui-pro/react": true
  electron: true
  heroui-pro: true
  esbuild: false
  sharp: false
  unrs-resolver: false
  electron-winstaller: false

# Shared dependency pins; the named catalog covers the Electron/Node exception.
catalog:
  "@biomejs/biome": 2.5.12
  "@expo/material-symbols": 0.1.1
  "@expo/ui": 57.0.18
  "@heroui/styles": 3.2.4
  "@hugeicons/core-free-icons": 4.3.0
  "@hugeicons/react-native": 1.0.16
  "@tanstack/react-query": 5.102.8
  "@testing-library/react-native": 14.0.1
  "@types/jest": "29"
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  expo: 57.0.22
  jest: "29"
  jest-expo: 57.0.5
  knip: 6.34.0
  lucide-react: 1.41.0
  motion: 13.2.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.3
  react-native-safe-area-context: 5.8.0
  react-native-svg: 15.15.5
  react-native-worklets: 0.10.1
  tailwindcss: 4.3.3
  test-renderer: 1.2.0
  tsup: 8.5.0
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 7.3.6
  vitest: 5.0.0
  zod: 4.5.4
catalogs:
  node24:
    "@types/node": 24.13.3
