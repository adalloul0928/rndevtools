packages:
  - 'apps/*'
  - 'packages/*'
  - 'examples/*'

nodeLinker: hoisted
engineStrict: true
minimumReleaseAge: 10080

blockExoticSubdeps: true

overrides:
  '@types/react': 19.2.18
  'react-dom': 19.2.3
  '@react-native/jest-preset': 0.86.3

allowBuilds:
  "@zowe/secrets-for-zowe-sdk": false
  "@heroui-pro/react": true
  esbuild: false
  electron-winstaller: false

# Shared dependency pins; the named catalog covers the Electron/Node exception.
catalog:
  "@biomejs/biome": 2.5.15
  "@expo/material-symbols": 0.1.1
  "@expo/ui": 57.0.22
  "@heroui/styles": 3.2.6
  "@hugeicons/core-free-icons": 4.3.5
  "@hugeicons/react-native": 1.0.16
  "@playwright/test": 1.64.0
  "@tanstack/react-query": 5.104.1
  "@testing-library/react-native": 14.1.0
  "@types/jest": "29"
  "@types/react": 19.2.18
  "@types/react-dom": 19.2.7
  expo: 57.0.27
  expo-dev-client: 57.0.19
  jest: "29"
  jest-expo: 57.0.5
  knip: 6.41.0
  lucide-react: 1.55.0
  motion: 14.1.0
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.3
  react-native-gesture-handler: 2.32.0
  react-native-reanimated: 4.5.5
  react-native-safe-area-context: 5.8.0
  react-native-svg: 15.15.5
  react-native-worklets: 0.10.4
  supabase: 2.121.0
  tailwindcss: 4.3.3
  test-renderer: 1.2.0
  tw-animate-css: 1.4.0
  typescript: 7.0.2
  vite: 8.3.4
  vitest: 5.0.3
  zod: 4.6.5
catalogs:
  # Electron 44 embeds Node 24, so its main-process types stay on 24.x.
  node24:
    "@types/node": 24.19.2
# Exact release verified by RN Devtools' native Supabase integration suites.
minimumReleaseAgeExclude:
  - '@supabase/cli-darwin-arm64@2.121.0'
  - '@supabase/cli-darwin-x64@2.121.0'
  - '@supabase/cli-linux-arm64-musl@2.121.0'
  - '@supabase/cli-linux-arm64@2.121.0'
  - '@supabase/cli-linux-x64-musl@2.121.0'
  - '@supabase/cli-linux-x64@2.121.0'
  - '@supabase/cli-windows-arm64@2.121.0'
  - '@supabase/cli-windows-x64@2.121.0'
  - supabase@2.121.0
